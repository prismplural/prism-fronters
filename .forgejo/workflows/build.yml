name: Build Docker Container

on:
  push:
    branches:
      - main
    
jobs:
  build-container:
    runs-on: docker-alpine

    steps:
      - name: Setup Docker
        uses: https://git.pals.gay/internal/docker-setup-action@bed5bc638575c899233a8249a92e70b90e74f66b
      - name: Login to package registry
        uses: https://git.pals.gay/internal/docker-login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: git.pals.gay
          username: fulmine
          password: ${{ secrets.PACKAGE_TOKEN }}
      - name: Build and push image
        uses: https://git.pals.gay/internal/docker-build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: git.pals.gay/fulmine/pluralkit-xyz:latest