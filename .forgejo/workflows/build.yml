name: Build Docker Container

on:
  push:
    branches:
      - main
    
jobs:
  build-container:
    runs-on: docker-alpine

    steps:
      - name: Setup Docker
        uses: https://git.pals.gay/internal/docker-setup-action@bed5bc638575c899233a8249a92e70b90e74f66b
      - name: Login to package registry
        uses: https://git.pals.gay/internal/docker-login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: git.pals.gay
          username: fulmine
          password: ${{ secrets.PACKAGE_TOKEN }}
      - name: Build and push image
        uses: https://git.pals.gay/internal/docker-build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: git.pals.gay/fulmine/pluralkit-xyz:latest